<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080d20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool tạo key">
<link rel="manifest" href="manifest.json">
<title>Tool tạo key — Minh An MOD (không cần server)</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080d20;color:#f1f5ff;min-height:100vh}
main{max-width:600px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px;color:#50d7c2}
.sub{font-size:13px;color:#8d9bb8;margin:0 0 18px;line-height:1.5}
.card{border:1px solid #344263;border-radius:16px;background:rgba(12,19,43,.9);padding:18px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px;color:#aebbd4}
label{display:block;font-size:14px;color:#aebbd4;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #3c4b6d;background:#080f22;color:#f1f5ff;font:inherit}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#50d7c2;color:#052b2a;font-weight:800;font-size:15px;cursor:pointer}
button.secondary{width:auto;margin:0;padding:6px 12px;font-size:12px;background:transparent;color:#50d7c2;border:1px solid #50d7c2}
button.warn{background:#2d6fa3;color:#f7f8ff}
button:disabled{opacity:.5}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:#aebbd4;word-break:break-word}
.msg.err{color:#ff8b8b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keys{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.key{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid #283655;border-radius:12px;background:#070d1b;font-family:ui-monospace,monospace;font-size:12px;color:#65d5c4;word-break:break-all}
.key button{width:auto;margin:0;flex:none}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pub{font-family:ui-monospace,monospace;font-size:12px;color:#65d5c4;word-break:break-all;background:#070d1b;border:1px solid #283655;border-radius:12px;padding:10px}
.warnbox{font-size:13px;color:#ffd3a1;line-height:1.5;margin-top:8px}

/* ===== Tối ưu cho điện thoại ===== */
html{-webkit-text-size-adjust:100%}
body{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
main{max-width:600px}
h1{font-size:clamp(20px,6vw,24px);line-height:1.3}
.sub{font-size:14px}
.card{padding:16px;border-radius:14px}
/* iOS sẽ tự phóng to nếu ô nhập nhỏ hơn 16px */
input,select,textarea{font-size:16px;min-height:46px}
textarea{min-height:120px}
label{font-size:15px}
button{min-height:48px;font-size:16px;touch-action:manipulation}
button.secondary{min-height:40px;min-width:88px;padding:8px 14px;font-size:14px}
.key{font-size:13px;padding:12px}
.key button{min-width:76px}
.head{flex-wrap:wrap}
.pub{font-size:12px}
@media (max-width:420px){
  .row{grid-template-columns:1fr}
}
@media (max-width:360px){
  .key{flex-direction:column;align-items:stretch}
  .key button{width:100%;min-height:42px}
}
</style>
</head>
<body>
<main>
  <h1>⚡ Tool tạo key — Minh An MOD</h1>

  <div class="card">
    <h2>1. Khoá</h2>

        <textarea id="privJwk" placeholder='Dán khoá bí mật đã lưu, ví dụ {"crv":"P-256",...}' spellcheck="false"></textarea>
  </div>

  <div class="card">
    <h2>2. Tạo key</h2>
    <div class="row">
      <div>
        <label for="duration">Thời hạn</label>
        <select id="duration">
          <option value="1tieng">1 tiếng</option>
          <option value="1day">1 ngày</option>
          <option value="7day" selected>7 ngày</option>
          <option value="30day">30 ngày</option>
          <option value="vinhvien">Vĩnh viễn</option>
        </select>
      </div>
      <div>
        <label for="count">Số lượng</label>
        <input id="count" type="number" min="1" max="100" value="1">
      </div>
    </div>
    <button id="makeBtn">TẠO KEY</button>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="card">
    <h2>3. Kiểm tra key và thời gian</h2>
    <label for="checkKeyInput">Dán key cần kiểm tra</label>
    <input id="checkKeyInput" placeholder="MA-..." autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="secondary" id="checkBtn" style="width:100%;margin-top:12px">KIỂM TRA KEY</button>
    <div class="pub" id="checkResult" hidden style="margin-top:12px;line-height:1.6"></div>
  </div>

  <div class="card" id="resultCard" hidden>
    <div class="head">
      <strong id="resultTitle"></strong>
      <button class="secondary" id="copyAllBtn">Sao chép tất cả</button>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const LABELS = {'1tieng':'1 tiếng','1day':'1 ngày','7day':'7 ngày','30day':'30 ngày','vinhvien':'Vĩnh viễn'};
const ALG = {name:'ECDSA', namedCurve:'P-256'};
const SIGN_ALG = {name:'ECDSA', hash:'SHA-256'};
let lastKeys = [];
const APP_PUBLIC_KEY = 'BGftbgsuLI-IF4FeWps1lwITQUGb1dSCVG624I1JCRuMVPsl2IZZV3MSfd8u7HOdw6UYpCnPsSP19rkjl7bH_gc';
let pubB64 = APP_PUBLIC_KEY;

function bytesToB64url(bytes){
  let s = ''; for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToBytes(s){
  const pad = s.length % 4 ? '='.repeat(4 - s.length % 4) : '';
  const bin = atob(s.replace(/-/g,'+').replace(/_/g,'/') + pad);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
function msg(t, err){ $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }

// Khoá công khai dạng raw (65 byte, bắt đầu bằng 0x04) = 0x04 || x || y
function publicRawFromJwk(jwk){
  const x = b64urlToBytes(jwk.x), y = b64urlToBytes(jwk.y);
  const raw = new Uint8Array(1 + x.length + y.length);
  raw[0] = 4; raw.set(x, 1); raw.set(y, 1 + x.length);
  return bytesToB64url(raw);
}


function normalizeJwkText(s){
  s = String(s || '')
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u201C\u201D\u201E\u201F\u00AB\u00BB]/g, '"')
    .replace(/[\u2018\u2019\u201A\u201B]/g, "'")
    .trim();
  if (s && !s.startsWith('{') && /"crv"|"kty"/.test(s)) s = '{' + s.replace(/^,|,$/g, '').trim() + '}';
  return s;
}
async function loadSigningKey(){
  let text = normalizeJwkText($('privJwk').value);
  if (!text) throw new Error('Chưa có khoá bí mật.');
  let jwk;
  try { jwk = JSON.parse(text); } catch(e) { throw new Error('Khoá bí mật không đọc được. Hãy copy đúng toàn bộ chuỗi, từ dấu { đến dấu }.'); }
  if (jwk.kty !== 'EC' || jwk.crv !== 'P-256' || !jwk.d || !jwk.x || !jwk.y) throw new Error('Khoá bí mật không đúng định dạng P-256 JWK.');
  pubB64 = publicRawFromJwk(jwk);
  if (pubB64 !== APP_PUBLIC_KEY) throw new Error('Khoá bí mật này không khớp với khoá công khai của app.');
  return crypto.subtle.importKey('jwk', jwk, ALG, false, ['sign']);
}

const DUR_CODE = {'1tieng':1,'1day':2,'7day':3,'30day':4,'vinhvien':5};
async function makeKey(sk, duration){
  // payload 3 byte: [mã thời hạn, nonce 2 byte]; chữ ký P-256 64 byte. Tổng 67 byte -> 90 ký tự.
  const nonce = crypto.getRandomValues(new Uint8Array(2));
  const payload = new Uint8Array([DUR_CODE[duration], nonce[0], nonce[1]]);
  const sig = new Uint8Array(await crypto.subtle.sign(SIGN_ALG, sk, payload));
  const all = new Uint8Array(payload.length + sig.length);
  all.set(payload, 0); all.set(sig, payload.length);
  return 'MA-' + bytesToB64url(all);
}

function render(duration, keys){
  lastKeys = keys;
  $('resultTitle').textContent = keys.length + ' key — ' + LABELS[duration];
  const box = $('keys'); box.innerHTML = '';
  keys.forEach(k => {
    const row = document.createElement('div'); row.className = 'key';
    const span = document.createElement('span'); span.textContent = k;
    const btn = document.createElement('button'); btn.className = 'secondary'; btn.textContent = 'Copy';
    btn.onclick = async () => { await copy(k); btn.textContent = 'Đã copy'; setTimeout(() => btn.textContent = 'Copy', 1200); };
    row.append(span, btn); box.append(row);
  });
  $('resultCard').hidden = false;
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}

$('makeBtn').addEventListener('click', async () => {
  const duration = $('duration').value;
  const count = Math.max(1, Math.min(100, parseInt($('count').value, 10) || 1));
  const btn = $('makeBtn'); btn.disabled = true;
  try {
    const sk = await loadSigningKey();
    const keys = [];
    for (let i = 0; i < count; i++) keys.push(await makeKey(sk, duration));
    render(duration, keys);
    msg('Đã tạo xong. Sao chép key trước khi đóng trang.');
  } catch(e) {
    msg('Lỗi: ' + e.message, true);
  } finally { btn.disabled = false; }
});

const DUR_NAME = {1:'1 tiếng',2:'1 ngày',3:'7 ngày',4:'30 ngày',5:'Vĩnh viễn'};
const DUR_MS = {1:3600000,2:86400000,3:604800000,4:2592000000,5:null};
function fmtTime(ts){ return new Date(ts).toLocaleString('vi-VN'); }
function showCheck(html, err){ const el=$('checkResult'); el.hidden=false; el.innerHTML=html; el.style.color = err ? '#ff8b8b' : '#65d5c4'; }
async function checkKeyInfo(){
  const raw = $('checkKeyInput').value.trim();
  const m = /^MA-([A-Za-z0-9_-]+)$/.exec(raw);
  if (!m) return showCheck('Key không đúng định dạng.', true);
  const all = b64urlToBytes(m[1]);
  if (all.length !== 67) return showCheck('Key không đúng độ dài.', true);
  const text = $('privJwk').value.trim();
  if (!text) return showCheck('Dán khoá bí mật ở mục 1 để kiểm tra chữ ký.', true);
  let jwk;
  try { jwk = JSON.parse(text); } catch(e) { return showCheck('Khoá bí mật không hợp lệ.', true); }
  const pubJwk = {kty:'EC', crv:'P-256', x:jwk.x, y:jwk.y, ext:true};
  const pub = await crypto.subtle.importKey('jwk', pubJwk, ALG, false, ['verify']);
  const payload = all.slice(0,3), sig = all.slice(3);
  const ok = await crypto.subtle.verify(SIGN_ALG, pub, sig, payload);
  if (!ok) return showCheck('Key KHÔNG hợp lệ với khoá này (sai khoá hoặc key bị sửa).', true);
  const code = payload[0];
  const name = DUR_NAME[code];
  if (!name) return showCheck('Mã thời hạn không xác định.', true);
  const ms = DUR_MS[code];
  if (ms === null) return showCheck('<b>Hợp lệ</b><br>Thời hạn: Vĩnh viễn', false);
  const now = Date.now();
  showCheck('<b>Hợp lệ</b><br>Thời hạn: ' + name + '<br>Nếu nhập lần đầu lúc ' + fmtTime(now) + ' thì hết hạn lúc ' + fmtTime(now + ms) + '.<br><span style="color:#8d9bb8">Thời hạn chỉ bắt đầu tính khi key được nhập lần đầu trên thiết bị.</span>', false);
}
$('checkBtn').addEventListener('click', async () => {
  try { await checkKeyInfo(); } catch(e) { showCheck('Lỗi khi kiểm tra: ' + e.message, true); }
});
$('copyAllBtn').addEventListener('click', async () => { await copy(lastKeys.join('\n')); msg('Đã sao chép toàn bộ key.'); });
</script>
</body>
</html>
